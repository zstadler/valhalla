# Place this at .github/workflows/docker-build.yml in zstadler/valhalla.
#
# Builds and publishes ghcr.io/zstadler/valhalla:latest and
# ghcr.io/zstadler/valhalla-scripted:latest from this fork, triggered by
# (in priority order):
#   1. a push to the dedicated branch (DEPLOY_BRANCH below)
#   2. a push of a tag matching the dedicated pattern (DEPLOY_TAG_PATTERN below)
#   3. manual dispatch from the Actions tab (workflow_dispatch)
#
# Unlike upstream's version of this workflow, there is no
# `if: github.repository_owner == 'valhalla'` gate - that line is what stops
# your own fork from ever publishing, since your repository_owner is
# 'zstadler', not 'valhalla'. This version drops it entirely, since the
# workflow already only lives in your fork.
#
# Simplified relative to upstream: single architecture (linux/amd64, the
# common case for a remote Linux server), no separate "-dev" debug variant,
# and always publishes ':latest' rather than deriving the tag from the ref
# name. Add the arm64/dev matrix back later if you ever need it - see the
# comment near the bottom.

name: Publish patched Docker image

on:
  push:
    branches:
      - "mapeak"
    tags:
      - "deploy-*"                # <-- set this to your dedicated tag pattern
  workflow_dispatch: {}            # last-priority manual trigger, any ref

permissions:
  contents: read
  packages: write

jobs:
  build_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Get version modifier
        id: extract_gitsha
        run: echo "version_modifier=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build order matters: the scripted image's Dockerfile pulls FROM the
      # plain image (VALHALLA_BUILDER_IMAGE build-arg), so the plain image
      # has to be pushed first and the scripted build has to reference the
      # freshly built tag, not a stale ':latest' from a previous run.
      - name: Build and push - plain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zstadler/valhalla:latest
          build-args: |
            VERSION_MODIFIER=${{ steps.extract_gitsha.outputs.version_modifier }}

      - name: Build and push - scripted image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile-scripted
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zstadler/valhalla-scripted:latest
          build-args: |
            VERSION_MODIFIER=${{ steps.extract_gitsha.outputs.version_modifier }}
            VALHALLA_BUILDER_IMAGE=ghcr.io/zstadler/valhalla:latest

# To add multi-arch (amd64 + arm64) back later: reintroduce the matrix over
# `os: [ubuntu-latest, ubuntu-24.04-arm]`, push per-arch tags (e.g.
# ':latest-amd64' / ':latest-arm64'), and add a `docker manifest create` /
# `docker manifest push` step to merge them into ':latest', the way
# upstream's workflow does it (see create-manifests in valhalla/valhalla's
# .github/workflows/docker-build.yml).
