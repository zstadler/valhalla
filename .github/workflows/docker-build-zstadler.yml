name: Publish patched Docker image

on:
  push:
    branches:
      - "mapeak"
    tags:
      - "deploy-*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  format_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check formatting
        run: |
          ./scripts/format.sh
          git diff --exit-code -- src valhalla test scripts src/bindings/python

  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: "recursive"
      - name: Install native deps
        run: ./scripts/install-linux-deps.sh
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build tests
        run: cmake --build build -j$(nproc) --target speed_assigner --target gurka_tracks_keep_lua_speed
      - name: Run tests
        run: |
          ./build/test/speed_assigner
          ./build/test/gurka/gurka_tracks_keep_lua_speed

  build_images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: "recursive"
          fetch-depth: 0

      - id: extract_gitsha
        run: echo "version_modifier=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build images
        run: |
          docker build -f docker/Dockerfile \
            --build-arg VERSION_MODIFIER=${{ steps.extract_gitsha.outputs.version_modifier }} \
            -t ghcr.io/zstadler/valhalla:latest .
          docker build -f docker/Dockerfile-scripted \
            --build-arg VALHALLA_BUILDER_IMAGE=ghcr.io/zstadler/valhalla:latest \
            -t ghcr.io/zstadler/valhalla-scripted:latest .
          docker save ghcr.io/zstadler/valhalla:latest ghcr.io/zstadler/valhalla-scripted:latest \
            -o /tmp/valhalla-images.tar

      - uses: actions/upload-artifact@v4
        with:
          name: valhalla-images
          path: /tmp/valhalla-images.tar
          retention-days: 1

  smoke_test:
    needs: build_images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: valhalla-images
      - run: docker load -i valhalla-images.tar

      - name: Build tiny tileset and route inside the scripted image
        run: |
          mkdir -p /tmp/smoke/tiles
          curl -sL -o /tmp/smoke/liechtenstein.osm.pbf \
            https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf
          docker run --rm  --entrypoint /bin/bash -v /tmp/smoke:/data ghcr.io/zstadler/valhalla-scripted:latest \
            -c "
              set -e
              valhalla_build_config --mjolnir-tile-dir /data/tiles \
                --mjolnir-timezone /data/tiles/timezones.sqlite > /data/valhalla.json
              valhalla_build_timezones > /data/tiles/timezones.sqlite
              valhalla_build_tiles -c /data/valhalla.json /data/liechtenstein.osm.pbf
              valhalla_service /data/valhalla.json route \
                '{\"locations\":[{\"lat\":47.141,\"lon\":9.521},{\"lat\":47.165,\"lon\":9.510}],\"costing\":\"auto\"}' \
                | grep -q '\"summary\"'
            "

  upstream_checks:
    uses: ./.github/workflows/linux.yml
    secrets: inherit

  publish:
    needs: [format_lint, unit_tests, build_images, smoke_test, upstream_checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: valhalla-images
      - run: docker load -i valhalla-images.tar

      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        run: |
          docker push ghcr.io/zstadler/valhalla:latest
          docker push ghcr.io/zstadler/valhalla-scripted:latest
